name: rent-watch
on:
  schedule:
    # cron 是 UTC（日本时间 = UTC+9），GitHub 高峰期可能延迟
    - cron: "3,23,43 23,0-12 * * *" # 日本时间 8:00–21:59 每 20 分钟
    - cron: "13 13-22 * * *"         # 日本时间 22:00–7:59 每小时
  workflow_dispatch:
    inputs:
      test_push:
        description: "只发一条测试消息（不查房源）"
        type: boolean
        default: false
      send_list:
        description: "再发一次现有房源一览"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: rent-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node watch.mjs ${{ inputs.test_push && '--test-push' || '' }} ${{ inputs.send_list && '--list' || '' }}
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update state" && git push)
